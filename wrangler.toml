# Cloudflare Pages / Wrangler configuration for Poongodi frontend
# Deploy with: npx wrangler pages deploy dist --project-name farm-products-frontend

name = "farm-products-frontend"

# Where Vite outputs the built site (required — without this Wrangler errors
# with "Missing entry-point to Worker script or to assets directory").
pages_build_output_dir = "./dist"

# Runtime compatibility date.
compatibility_date = "2026-11-24"

# Production environment variables are set in the Cloudflare Pages dashboard
# (Settings → Environment variables). BACKEND_URL must be defined there.
# Do not put BACKEND_URL here — this file is committed to git.